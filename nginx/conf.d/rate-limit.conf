# Zona de rate-limit para el login/uso del webmail. 1 req/s con ráfaga de 20
# absorbe el uso normal de una sesión de Roundcube, pero limita con fuerza
# los intentos automatizados de fuerza bruta contra el login.
limit_req_zone $binary_remote_addr zone=roundcube:10m rate=1r/s;
limit_req_status 429;
