[Definition]
# Roundcube corre detrás de un proxy Docker que oculta la IP real del cliente
# en el campo "from" del log (queda como la IP del gateway del bridge de
# Docker, por el hairpin NAT inherente a publicar un puerto y consumirlo
# desde el propio host vía 127.0.0.1). La IP real del visitante sí llega
# en la cabecera X-Real-IP que nginx reenvía, y Roundcube la registra entre
# paréntesis — por eso el filtro apunta ahí en vez de al campo "from".
failregex = Failed login for \S+ from \S+ \(X-Real-IP: <HOST>,
ignoreregex =
